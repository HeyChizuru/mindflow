<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 56" fill="none" role="img" aria-label="MindFlow">
  <title>MindFlow</title>

  <!-- Big M behind the wordmark, wrapping the lowercase m -->
  <g transform="translate(8, 2) scale(0.46)">
    <path
      d="M 12 78 L 28 22 L 50 50 L 72 22 L 85 38"
      stroke="currentColor"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="30"
    y="28"
    dominant-baseline="central"
    font-family="Geist, &quot;SF Pro Display&quot;, Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="27"
    letter-spacing="-1.35"
    fill="currentColor"
    text-rendering="geometricPrecision"
  >
    <tspan font-weight="600">mind</tspan><tspan font-weight="400" dx="0.5">flow</tspan>
  </text>
</svg>
